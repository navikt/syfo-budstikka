apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: syfo-budstikka
  namespace: team-esyfo
  labels:
    team: team-esyfo
  annotations:
    texas.nais.io/enabled: "true"
spec:
  image: {{image}}
  port: 8080
  liveness:
    path: /internal/health/is_alive
    initialDelay: 10
    timeout: 5
    periodSeconds: 10
    failureThreshold: 5
  readiness:
    path: /internal/health/is_ready
    initialDelay: 10
    periodSeconds: 5
    timeout: 5
  # Resources: a 512Mi memory request reserves baseline capacity, while the 1024Mi limit leaves
  # headroom (JVM MaxRAMPercentage=75 → up to ~768Mi heap). No CPU limit avoids throttling; the CPU
  # request is slightly above dev for steadier scheduling under consumer load.
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 512Mi
  # Pod count: minimum 2 provides HA, so the application survives rolling deployments and node loss.
  # Maximum 4 leaves capacity to drain delivery/inbox backlog (workers are not partition-bound: they
  # poll the database with SKIP LOCKED, so N equal instances are safe). No leaderElection:
  # periodic sweeps coordinate through FOR UPDATE SKIP LOCKED in the claim queries.
  replicas:
    min: 2
    max: 4
  prometheus:
    enabled: true
    path: /internal/metrics # POD_METRICS_PATH (metrics, not prometheus)
  observability:
    logging:
      destinations:
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java # OTel agent sets W3C traceparent → Tempo
  kafka:
    pool: nav-prod # topic: nais/topics/kafka-prod.yaml (team-esyfo.budstikka.v1)
  azure:
    application:
      enabled: true
  accessPolicy:
    outbound:
      rules:
        - application: notifikasjon-produsent-api
          namespace: fager
        - application: digdir-krr-proxy
          namespace: team-rocket
        - application: esyfo-narmesteleder
          namespace: team-esyfo
      external:
        - host: pdl-api.prod-fss-pub.nais.io
        - host: dokdistfordeling.prod-fss-pub.nais.io
  gcp:
    sqlInstances:
      - name: budstikka-instance
        collation: nb_NO
        type: POSTGRES_18
        tier: db-custom-1-5120
        diskAutoresize: true
        diskAutoresizeLimit: 20
        # No pointInTimeRecovery: the complete database derives from Kafka (inbox/delivery/dead_letter)
        # and can be rebuilt with 90-day replay and idempotent consumption. Daily automatic
        # backups cover total database loss. Enable it if the RPO requirement tightens.
        # No regional highAvailability: it doubles cost, while a short database failover is not critical
        # here: Kafka retains messages for 90 days and consumption is idempotent (retry/replay).
        # Enable it if RPO/RTO requirements tighten.
        databases:
          - name: budstikka-db
            # application.conf reads BUDSTIKKA_DB_URL/_USERNAME/_PASSWORD/_SSLKEY_PK8
            envVarPrefix: BUDSTIKKA_DB
  env:
    - name: WORKER_RETENTION_CLEANUP_ENABLED
      value: "false"
    - name: PDL_URL
      value: https://pdl-api.prod-fss-pub.nais.io/graphql
    - name: PDL_SCOPE
      value: api://prod-fss.pdl.pdl-api/.default
    - name: DOCUMENT_DISTRIBUTOR_URL
      value: https://dokdistfordeling.prod-fss-pub.nais.io/rest/v1/distribuerjournalpost
    - name: DOCUMENT_DISTRIBUTOR_SCOPE
      value: api://prod-fss.teamdokumenthandtering.dokdistfordeling/.default
    - name: KRR_URL
      value: https://digdir-krr-proxy.intern.nav.no/rest/v1/person
    - name: KRR_SCOPE
      value: api://prod-gcp.team-rocket.digdir-krr-proxy/.default
    - name: ARBEIDSGIVER_NOTIFIKASJON_URL
      value: http://notifikasjon-produsent-api.fager/api/graphql
    - name: ARBEIDSGIVER_NOTIFIKASJON_SCOPE
      value: api://prod-gcp.fager.notifikasjon-produsent-api/.default
    - name: NARMESTELEDER_URL
      value: http://esyfo-narmesteleder.team-esyfo
    - name: NARMESTELEDER_SCOPE
      value: api://prod-gcp.team-esyfo.esyfo-narmesteleder/.default
