apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: syfo-budstikka-alerts
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  groups:
    - name: syfo-budstikka-consumer-lag
      rules:
        # Kafka-lag er et diagnostisk signal om vedvarende backlogg i inntaket. Det beviser ikke
        # at downstream-leveranser har stoppet eller at brukere er påvirket. Runbook:
        # docs/helsesjekk.md («Consumer-lag-alarm»).
        - alert: BudstikkaConsumerLagWarning
          expr: >
            max by (topic)
            (kafka_consumer_fetch_manager_records_lag_max{app="syfo-budstikka",
            namespace="team-esyfo", topic="team-esyfo.budstikka.v1"}) > 100
          for: 15m
          labels:
            namespace: team-esyfo
            severity: warning
          annotations:
            summary: >-
              Consumer-gruppen syfo-budstikka-budstikka-v1 har hatt over 100 meldinger lag på
              team-esyfo.budstikka.v1 i 15 minutter.
            consequence: >-
              Kafka-inntaket har en vedvarende backlogg. Lag alene viser ikke om
              downstream-leveranser har stoppet eller om brukere er påvirket.
            action: >-
              Følg runbooken i docs/helsesjekk.md («Consumer-lag-alarm»): bekreft lagtrenden, sjekk
              dead letters, inbox-feil og logger. Ikke logg nøkler eller payload.
