# Test/local override layer. Loaded by BudstikkaTestApp.testConfig and layered ON TOP OF the production
# configuration (application.conf) through withFallback: application-local.conf overrides application.conf,
# and dynamic container values in code override both.
#
# This file deliberately has a distinct name (not application.conf): both resources directories are on the
# same test classpath, so a test file named application.conf could shadow the production configuration
# depending on classpath order. A distinct name plus explicit withFallback makes shadowing impossible.
#
# Only static local values belong here. Container values
# (database.host/port/name/username/password/url and kafka.bootstrapServers) are runtime values from
# Testcontainers — unknown until the containers are running — and are therefore set in code by
# BudstikkaTestApp.testConfig, not here.

pdl.scope = "local"

auth.texas.tokenEndpoint = "localhost"

kafka.consumers.budstikka.enabled = "true"

# Local monitoring (Grafana/Prometheus containers) — a human inspection tool for the local run
# (LocalApp) only. Disabled by default for fast startup without containers; enable it with
# MONITORING_ENABLED=true. Only the local run reads this: e2e never passes a withMonitoring factory
# to BudstikkaTestApp.start, so the flag is inert there regardless of its value.

monitoring {
    enabled = "false"
    enabled = ${?MONITORING_ENABLED}
}

ktor {
  # The module is loaded programmatically by BudstikkaTestApp.start (configureApplication), not from configuration.
  application.modules = []
  # Lets the overrides lambda (fakes) take precedence over the real adapters in the DI graph.
  di.conflictPolicy = "OverridePrevious"
}
