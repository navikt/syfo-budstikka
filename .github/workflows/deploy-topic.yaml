name: "Deploy topic"
on:
  push:
    paths:
      - nais/topics/**
      - .github/workflows/deploy-topic.yaml
    branches:
      - main
concurrency:
  group: deploy-topics-${{ github.ref }}
  cancel-in-progress: true
env:
  TOPIC_DEV_FILES: nais/topics/kafka-dev.yaml
  TOPIC_PROD_FILES: nais/topics/kafka-prod.yaml
jobs:
  validate-topic-manifests:
    name: Validate topic manifests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Nais CLI
        env:
          NAIS_CLI_SHA256: fe51c24e8f54231e929c83f54cd4eef569d629565a32ed8f9ac6905296b59b3d
          NAIS_CLI_VERSION: 5.44.4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nais-cli_${NAIS_CLI_VERSION}_linux_amd64.tgz"
          install_dir="$RUNNER_TEMP/nais-cli-${NAIS_CLI_VERSION}"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/nais/cli/releases/download/v${NAIS_CLI_VERSION}/nais-cli_linux_amd64.tgz" \
            --output "$archive"
          printf '%s  %s\n' "$NAIS_CLI_SHA256" "$archive" |
            sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          chmod 0755 "$install_dir/nais"
          "$install_dir/nais" --version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Validate development Kafka topic
        env:
          DO_NOT_TRACK: "1"
        run: nais validate --var kafka-pool=nav-dev "$TOPIC_DEV_FILES"
      - name: Validate production Kafka topic
        env:
          DO_NOT_TRACK: "1"
        run: nais validate --var kafka-pool=nav-prod "$TOPIC_PROD_FILES"

  deploy-topic-to-dev:
    name: Deploy topic to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-topic-manifests
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy topics to dev
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        env:
          VAR: kafka-pool=nav-dev
          CLUSTER: dev-gcp
          RESOURCE: ${{ env.TOPIC_DEV_FILES }}

  deploy-topic-to-prod:
    name: Deploy topic to prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-topic-to-dev
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy topics to prod
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # v2
        env:
          VAR: kafka-pool=nav-prod
          CLUSTER: prod-gcp
          RESOURCE: ${{ env.TOPIC_PROD_FILES }}
