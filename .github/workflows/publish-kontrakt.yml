name: Publish contract

on:
  push:
    tags:
      - "kontrakt/v*"

permissions: {}

concurrency:
  group: publish-kontrakt
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      contract_version: ${{ steps.version.outputs.contract_version }}
    steps:
      - name: Require tag creation, update and deletion restrictions
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          repository="$REPOSITORY"
          if [[ ! "$repository" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid GitHub repository name for ruleset preflight."
            exit 1
          fi
          owner="${repository%%/*}"
          repository_name="${repository#*/}"
          if [[ "$owner" == "." || "$owner" == ".." || "$repository_name" == "." || "$repository_name" == ".." ]]; then
            echo "::error::Invalid GitHub repository name for ruleset preflight."
            exit 1
          fi

          fetch_ruleset_json() {
            local url="$1"
            local body_file
            local curl_exit
            local status

            body_file="$(mktemp)" ||
              {
                echo "::error::Could not create temporary storage for the GitHub ruleset API response." >&2
                return 1
              }

            if status="$(
              curl \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$body_file" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "User-Agent: budstikka-contract-ruleset-preflight" \
              "$url"
            )"; then
              curl_exit=0
            else
              curl_exit=$?
            fi

            if [[ "$curl_exit" -ne 0 ]]; then
              rm -f "$body_file"
              echo "::error::Network or no-response error from the unauthenticated GitHub ruleset API (curl exit ${curl_exit}); failing closed." >&2
              return 1
            fi

            if [[ ! "$status" =~ ^[1-5][0-9]{2}$ ]]; then
              rm -f "$body_file"
              echo "::error::GitHub ruleset API response had a malformed or missing HTTP status; failing closed." >&2
              return 1
            fi

            case "$status" in
              200)
                if ! cat "$body_file"; then
                  rm -f "$body_file"
                  echo "::error::Could not read the GitHub ruleset API response body; failing closed." >&2
                  return 1
                fi
                rm -f "$body_file"
                ;;
              403)
                rm -f "$body_file"
                echo "::error::Unauthenticated GitHub ruleset API rate limit may be exhausted (HTTP 403); retry later rather than changing the ruleset." >&2
                return 1
                ;;
              *)
                rm -f "$body_file"
                echo "::error::GitHub ruleset API request failed with HTTP ${status}; failing closed." >&2
                return 1
                ;;
            esac
          }

          tag_ruleset_ids=()
          page=1
          while :; do
            if (( page > 1000 )); then
              echo "::error::Ruleset pagination exceeded 1000 pages and is incomplete."
              exit 1
            fi

            page_json="$(
              fetch_ruleset_json \
                "https://api.github.com/repos/${repository}/rulesets?includes_parents=true&per_page=100&page=${page}"
            )"
            page_result="$(
              printf '%s' "$page_json" |
                python3 -c '
          import json
          import sys

          try:
              rulesets = json.load(sys.stdin)
          except json.JSONDecodeError as error:
              raise SystemExit(f"Could not parse GitHub ruleset list JSON: {error}") from error

          if not isinstance(rulesets, list):
              raise SystemExit("GitHub ruleset list response is not an array.")

          tag_ruleset_ids = []
          for ruleset in rulesets:
              if not isinstance(ruleset, dict):
                  raise SystemExit("GitHub ruleset list contains a non-object entry.")
              if ruleset.get("target") == "tag" and ruleset.get("enforcement") == "active":
                  ruleset_id = ruleset.get("id")
                  if not isinstance(ruleset_id, int):
                      raise SystemExit("An active tag ruleset has no numeric ID.")
                  tag_ruleset_ids.append(ruleset_id)

          print(f"count={len(rulesets)}")
          print(*tag_ruleset_ids, sep="\n")
          '
            )"
            mapfile -t page_lines <<< "$page_result"
            page_count="${page_lines[0]#count=}"
            if [[ ! "$page_count" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not determine GitHub ruleset page size."
              exit 1
            fi
            for ruleset_id in "${page_lines[@]:1}"; do
              [[ "$ruleset_id" =~ ^[0-9]+$ ]] ||
                {
                  echo "::error::GitHub ruleset list returned an invalid ruleset ID."
                  exit 1
                }
              tag_ruleset_ids+=("$ruleset_id")
            done

            (( page_count < 100 )) && break
            ((page += 1))
          done

          for ruleset_id in "${tag_ruleset_ids[@]}"; do
            ruleset_json="$(
              fetch_ruleset_json \
                "https://api.github.com/repos/${repository}/rulesets/${ruleset_id}?includes_parents=true"
            )"
            ruleset_match="$(
              printf '%s' "$ruleset_json" |
                python3 -c '
          import json
          import sys

          try:
              ruleset = json.load(sys.stdin)
          except json.JSONDecodeError as error:
              raise SystemExit(f"Could not parse GitHub ruleset detail JSON: {error}") from error

          if not isinstance(ruleset, dict):
              raise SystemExit("GitHub ruleset detail response is not an object.")
          ref_name = ruleset.get("conditions", {}).get("ref_name", {})
          if not isinstance(ref_name, dict):
              raise SystemExit("GitHub ruleset detail has invalid ref-name conditions.")
          includes = ref_name.get("include", [])
          excludes = ref_name.get("exclude", [])
          rules = ruleset.get("rules", [])
          if (
              not isinstance(includes, list)
              or not all(isinstance(include, str) for include in includes)
              or not isinstance(excludes, list)
              or not all(isinstance(exclude, str) for exclude in excludes)
              or not isinstance(rules, list)
          ):
              raise SystemExit("GitHub ruleset detail has invalid conditions or rules.")
          matches_contract_tags = (
              ruleset.get("target") == "tag"
              and ruleset.get("enforcement") == "active"
              and includes == ["refs/tags/kontrakt/v*"]
              and not excludes
          )
          required_rule_types = {"creation", "update", "deletion"}
          rule_types = set()
          for rule in rules:
              if not isinstance(rule, dict) or not isinstance(rule.get("type"), str):
                  raise SystemExit("GitHub ruleset detail has an invalid rule.")
              rule_types.add(rule["type"])
          print("match" if matches_contract_tags and required_rule_types <= rule_types else "no-match")
          '
            )"
            if [[ "$ruleset_match" == "match" ]]; then
              exit 0
            fi
            if [[ "$ruleset_match" != "no-match" ]]; then
              echo "::error::Could not determine whether a GitHub ruleset matches contract tags."
              exit 1
            fi
          done

          echo "::error::Maintainers must configure an active tag ruleset matching refs/tags/kontrakt/v* with creation, update and deletion restrictions before the first contract release."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Validate SemVer, main ancestry and release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^kontrakt/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected an exact kontrakt/vX.Y.Z tag without leading zeroes; got $tag"
            exit 1
          fi

          version="${tag#kontrakt/v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            {
              echo "::error::The tagged commit is not reachable from origin/main."
              exit 1
            }

          notes="docs/releases/kontrakt/${version}.md"
          test -f "$notes"
          grep --fixed-strings --line-regexp "# budstikka-kontrakt ${version}" "$notes"

          VERSION="$version" python3 -c '
          import os
          from pathlib import Path
          Path(os.environ["GITHUB_OUTPUT"]).open("a").write(
              "contract_version=" + os.environ["VERSION"] + "\n"
          )
          '

  prepare-and-attest:
    name: Build, verify and attest contract
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Preflight immutable package version
        shell: bash
        env:
          CONTRACT_VERSION: ${{ needs.validate.outputs.contract_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$CONTRACT_VERSION"
          package_url="https://maven.pkg.github.com/navikt/syfo-budstikka/no/nav/syfo/budstikka-kontrakt/${version}/budstikka-kontrakt-${version}.pom"
          curl_config="$(mktemp)"
          chmod 600 "$curl_config"
          trap 'rm -f "$curl_config"' EXIT
          printf 'user = "x-access-token:%s"\n' "$GITHUB_TOKEN" | dd of="$curl_config" status=none
          unset GITHUB_TOKEN

          status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 30 \
              --output /dev/null \
              --write-out "%{http_code}" \
              --config "$curl_config" \
              "$package_url"
          )"
          case "$status" in
            404)
              ;;
            200)
              echo "::error::Immutable contract version ${version} already exists in GitHub Packages."
              exit 1
              ;;
            *)
              echo "::error::Could not preflight ${package_url}: HTTP ${status}."
              exit 1
              ;;
          esac

      - id: previous-contract
        name: Resolve authoritative contract baseline
        shell: bash
        env:
          CONTRACT_VERSION: ${{ needs.validate.outputs.contract_version }}
        run: |
          set -euo pipefail

          version="$(bash scripts/verify-contract-baseline.sh --current-version "$CONTRACT_VERSION")"
          VERSION="$version" python3 -c '
          import os
          from pathlib import Path
          Path(os.environ["GITHUB_OUTPUT"]).open("a").write(
              "version=" + os.environ["VERSION"] + "\n"
          )
          '

      - name: Build, verify compatibility and stage contract
        shell: bash
        env:
          CONTRACT_VERSION: ${{ needs.validate.outputs.contract_version }}
          PREVIOUS_CONTRACT_VERSION: ${{ steps.previous-contract.outputs.version }}
        run: |
          set -euo pipefail

          version="$CONTRACT_VERSION"
          previous_version="$PREVIOUS_CONTRACT_VERSION"
          case "$previous_version" in
            first-release)
            echo "No authoritative contract release tag exists: validating the explicit first-release path."
              ./gradlew --no-daemon \
                -PcontractVersion="$version" \
                :kontrakt:build \
                :kontrakt:checkStagedConsumer
              ;;
            *)
              ./gradlew --no-daemon \
                -PcontractVersion="$version" \
                -PpreviousContractVersion="$previous_version" \
                :kontrakt:build \
                :kontrakt:checkStagedConsumer
              ;;
          esac

      - name: Verify staged subjects match publication inputs before attestation
        shell: bash
        env:
          CONTRACT_VERSION: ${{ needs.validate.outputs.contract_version }}
        run: |
          set -euo pipefail

          version="$CONTRACT_VERSION"
          staging_directory="kontrakt/build/staging-maven-repository/no/nav/syfo/budstikka-kontrakt/${version}"

          compare() {
            local publication_input="$1"
            local staged_subject="$2"

            test -f "$publication_input"
            test -f "$staged_subject"
            cmp --silent "$publication_input" "$staged_subject" ||
              {
                echo "::error::Staged attestation subject differs from publication input: ${staged_subject}."
                exit 1
              }
          }

          compare "kontrakt/build/libs/kontrakt-${version}.jar" \
            "${staging_directory}/budstikka-kontrakt-${version}.jar"
          compare "kontrakt/build/libs/kontrakt-${version}-sources.jar" \
            "${staging_directory}/budstikka-kontrakt-${version}-sources.jar"
          compare "kontrakt/build/publications/contract/pom-default.xml" \
            "${staging_directory}/budstikka-kontrakt-${version}.pom"
          compare "kontrakt/build/publications/contract/module.json" \
            "${staging_directory}/budstikka-kontrakt-${version}.module"

      - name: Attest staged publication
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            kontrakt/build/staging-maven-repository/no/nav/syfo/budstikka-kontrakt/${{ needs.validate.outputs.contract_version }}/budstikka-kontrakt-${{ needs.validate.outputs.contract_version }}.jar
            kontrakt/build/staging-maven-repository/no/nav/syfo/budstikka-kontrakt/${{ needs.validate.outputs.contract_version }}/budstikka-kontrakt-${{ needs.validate.outputs.contract_version }}-sources.jar
            kontrakt/build/staging-maven-repository/no/nav/syfo/budstikka-kontrakt/${{ needs.validate.outputs.contract_version }}/budstikka-kontrakt-${{ needs.validate.outputs.contract_version }}.pom
            kontrakt/build/staging-maven-repository/no/nav/syfo/budstikka-kontrakt/${{ needs.validate.outputs.contract_version }}/budstikka-kontrakt-${{ needs.validate.outputs.contract_version }}.module

      - name: Publish attested contract to GitHub Packages
        env:
          CONTRACT_VERSION: ${{ needs.validate.outputs.contract_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon -PcontractVersion="$CONTRACT_VERSION" :kontrakt:publishContractPublicationToGithubPackagesRepository

      - name: Verify staged subjects match publication inputs after publication
        shell: bash
        env:
          CONTRACT_VERSION: ${{ needs.validate.outputs.contract_version }}
        run: |
          set -euo pipefail

          version="$CONTRACT_VERSION"
          staging_directory="kontrakt/build/staging-maven-repository/no/nav/syfo/budstikka-kontrakt/${version}"

          compare() {
            local publication_input="$1"
            local staged_subject="$2"

            test -f "$publication_input"
            test -f "$staged_subject"
            cmp --silent "$publication_input" "$staged_subject" ||
              {
                echo "::error::Staged attestation subject differs from publication input: ${staged_subject}."
                exit 1
              }
          }

          compare "kontrakt/build/libs/kontrakt-${version}.jar" \
            "${staging_directory}/budstikka-kontrakt-${version}.jar"
          compare "kontrakt/build/libs/kontrakt-${version}-sources.jar" \
            "${staging_directory}/budstikka-kontrakt-${version}-sources.jar"
          compare "kontrakt/build/publications/contract/pom-default.xml" \
            "${staging_directory}/budstikka-kontrakt-${version}.pom"
          compare "kontrakt/build/publications/contract/module.json" \
            "${staging_directory}/budstikka-kontrakt-${version}.module"

  verify-mirror:
    name: Resolve published contract through Nav mirror
    needs: [validate, prepare-and-attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve exact published version through Nav mirror
        env:
          CONTRACT_VERSION: ${{ needs.validate.outputs.contract_version }}
        run: |
          ./gradlew --no-daemon \
            --gradle-user-home "$RUNNER_TEMP/contract-mirror-gradle-home" \
            --project-cache-dir "$RUNNER_TEMP/contract-mirror-project-cache" \
            -p kontrakt/consumer-fixture \
            check \
            -PcontractRepository=https://github-package-registry-mirror.gc.nav.no/cached/maven-release \
            -PcontractVersion="$CONTRACT_VERSION" \
            -PconsumerBuildDirectory="$RUNNER_TEMP/contract-mirror-consumer-build"

  create-release:
    name: Create GitHub Release
    needs: [validate, verify-mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release from checked-in notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_VERSION: ${{ needs.validate.outputs.contract_version }}
        run: |
          set -euo pipefail

          tag="kontrakt/v${CONTRACT_VERSION}"
          title="budstikka-kontrakt ${CONTRACT_VERSION}"
          notes="docs/releases/kontrakt/${CONTRACT_VERSION}.md"
          encoded_tag="$(
            TAG="$tag" python3 -c '
          import os
          from urllib.parse import quote

          print(quote(os.environ["TAG"], safe=""))
          '
          )"

          api_exit=0
          if response="$(gh api --include --silent --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}")"; then
            api_exit=0
          else
            api_exit=$?
          fi

          status="$(
            RESPONSE="$response" python3 -c '
          import os
          import re
          import sys

          matches = re.findall(r"^HTTP/\S+\s+(\d{3})\b", os.environ["RESPONSE"], re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit("Could not determine the GitHub Release API response status.")
          print(matches[0])
          '
          )"

          case "$status" in
            404)
              if [[ "$api_exit" -eq 0 ]]; then
                echo "::error::GitHub Release lookup returned HTTP 404 without an API error."
                exit 1
              fi
              gh release create "$tag" \
                --verify-tag \
                --title "$title" \
                --notes-file "$notes"
              ;;
            200)
              if [[ "$api_exit" -ne 0 ]]; then
                echo "::error::GitHub Release lookup returned HTTP 200 but gh api failed."
                exit 1
              fi
              release="$(gh release view "$tag" --json name,body,isDraft,isPrerelease)"
              RELEASE="$release" EXPECTED_TITLE="$title" NOTES="$notes" python3 -c '
          import json
          import os
          from pathlib import Path

          try:
              release = json.loads(os.environ["RELEASE"])
          except json.JSONDecodeError as error:
              raise SystemExit(f"Could not parse existing GitHub Release: {error}")

          expected = {
              "name": os.environ["EXPECTED_TITLE"],
              "body": Path(os.environ["NOTES"]).read_text(encoding="utf-8").rstrip("\n"),
              "isDraft": False,
              "isPrerelease": False,
          }
          actual = {
              "name": release.get("name"),
              "body": release.get("body", "").rstrip("\n"),
              "isDraft": release.get("isDraft"),
              "isPrerelease": release.get("isPrerelease"),
          }
          if actual != expected:
              raise SystemExit(
                  "Existing GitHub Release does not match checked-in expectations: "
                  f"expected {expected!r}, got {actual!r}."
              )
          '
              echo "Existing GitHub Release matches checked-in expectations."
              ;;
            *)
              echo "::error::Could not look up GitHub Release ${tag}: HTTP ${status}."
              exit 1
              ;;
          esac
