name: Reusable CI

# Gjenbrukbar CI-gate (workflow_call). Executes ci.yaml on PR and in merge queue. Shares the same
# deterministic gates as the rest of the repository: agent model pins, compilation + ktlint + test, and
# container-image build (Jib, without push). See .github/instructions/github-actions.instructions.md.
on:
  workflow_call:

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC for nais/login and nais/deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deterministic gate 1: agent model pins on allowlist (hard fail).
      - name: Validate agent model pins
        run: bash scripts/validate-agent-models.sh .github/agents

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25" # should match the config in libs.versions.toml file
          cache: gradle

      - id: contract-paths
        name: Detect contract-relevant changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          run_contract_gates=false
          reason="no contract-relevant files changed"

          if [[ -z "${BASE_SHA:-}" || -z "${GITHUB_SHA:-}" ]]; then
            run_contract_gates=true
            reason="no reliable base or head SHA is available"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" || ! git cat-file -e "${GITHUB_SHA}^{commit}"; then
            run_contract_gates=true
            reason="base or head SHA is unavailable in the checkout"
          else
            while IFS= read -r path; do
              case "$path" in
                kontrakt/* | \
                build.gradle.kts | settings.gradle.kts | gradle.properties | gradlew | gradlew.bat | \
                gradle/wrapper/* | gradle/libs.versions.toml | \
                scripts/verify-contract-baseline.sh | \
                .github/workflows/ci-reusable.yml | .github/workflows/publish-kontrakt.yml)
                  run_contract_gates=true
                  reason="contract-relevant file changed: $path"
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi

          printf 'run_contract_gates=%s\nreason=%s\n' "$run_contract_gates" "$reason" >> "$GITHUB_OUTPUT"
          echo "Contract compatibility gates: $run_contract_gates ($reason)."

      # Deterministic gate 2: compilation + ktlint + full test suite (E2E excluded, ADR 0006).
      - name: Build, lint and test
        run: ./gradlew build --no-daemon

      - id: previous-contract
        name: Resolve latest published contract baseline
        if: ${{ steps.contract-paths.outputs.run_contract_gates == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(bash scripts/verify-contract-baseline.sh)"
          VERSION="$version" python3 -c '
          import os
          from pathlib import Path
          Path(os.environ["GITHUB_OUTPUT"]).open("a").write(
              "version=" + os.environ["VERSION"] + "\n"
          )
          '

      # A published baseline is mandatory when authoritative release tags exist. The isolated consumer
      # deliberately proves resolution without the runner's Gradle cache.
      - name: Verify contract compatibility and standalone consumer
        if: ${{ steps.contract-paths.outputs.run_contract_gates == 'true' }}
        shell: bash
        env:
          PREVIOUS_CONTRACT_VERSION: ${{ steps.previous-contract.outputs.version }}
        run: |
          set -euo pipefail

          previous_version="$PREVIOUS_CONTRACT_VERSION"
          if [[ "$previous_version" == "first-release" ]]; then
            echo "No authoritative contract release tag exists: using the explicit first-release compatibility path."
            ./gradlew :kontrakt:checkLocalConsumer --no-daemon
          else
            ./gradlew \
              -PpreviousContractVersion="$previous_version" \
              :kontrakt:checkPublishedContractCompatibility \
              :kontrakt:checkLocalConsumer \
              --no-daemon
          fi

      - name: Login GAR (Google Artifact Registry)
        id: login
        uses: nais/login@v0 # internal Nav-action; sets up GAR-auth and provides registry output
        with:
          team: team-esyfo

      # Deterministic gate 3: build container-image with Jib WITHOUT push (ADR 0010). Catches
      # base-image-/Jib configuration errors in PR instead of on main-deploy. jibBuildTar pre-pulls
      # Chainguard base to the docker daemon (docker:// due to OCI 1.1 bug), which is available on the runner.
      - name: Build container-image (Jib, no-push)
        run: ./gradlew jibBuildTar --no-daemon

      # Next steps (follow .github/instructions/github-actions.instructions.md):
      # SCA/CVE scan (Trivy) + secret scan (gitleaks) — add with PINNED
      # version/SHA, .trivyignore-baseline, and for org-repo gitleaks license. Kept
      # outside here until version + baseline is verified, so the gate does not turn red on
      # unverified basis.
