[propose]
# ⚠️  grants access to Docker socket — effectively root on the host
# Suggested by: (root)
allow_docker = true
# Suggested by: (root), kontrakt
allow_jvm_attach = true
# Suggested by: (root)
allow_localhost_any = true
allow_tmp_exec = true

[propose.allow]
socket = ["~/.local/share/containers/podman/machine/podman.sock"]

# To generate machine-specific config, run `cplt init --global --write`
