info:
  name: Produce MicrofrontendCreate
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/local/produce"
  body:
    type: json
    data: |-
      {
        "topic": "{{budstikkaTopic}}",
        "key": "12345678901",
        "value": "{\"reference\":\"bruno-ref-1\",\"content\":{\"type\":\"MicrofrontendEnable\",\"personIdentifier\":\"12345678901\",\"microfrontendId\":\"syfo-microfrontend\"}}",
        "headers": {
          "eventId": "{{eventId}}"
        }
      }

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("eventId", crypto.randomUUID());
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
